services:
  # N8N Workflows Documentation Service
  workflows-docs:
    image: n8n-workflows-zh:latest
    container_name: n8n-workflows-docs
    ports:
      - "8000:8000"
    volumes:
      - workflows-db:/app/database
      - workflows-logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - workflows-network

networks:
  workflows-network:
    driver: bridge

volumes:
  workflows-db:
  workflows-logs:
